# DOSBox-X config for scripted, instrumented WC2 reference runs of the disposable
# tmp/pc-root (make prepare-reference). Cycles are fixed so runs are comparable;
# the CPU level the game needs is still open (open-work).

[sdl]
fullscreen = false
output = surface
autolock = false

[dosbox]
machine = svga_s3
memsize = 4
captures = cap

[cpu]
core = normal
cputype = 386
cycles = fixed 12000

[dos]
ems = true
xms = true

[mixer]
nosound = true

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
oplmode = auto

[log]
logfile = dosbox-x.log
