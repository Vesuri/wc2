# DOSBox-X config for scripted, instrumented WC2 reference runs (tools/pc_run.py,
# make reference). The machine matches reference/dosbox-staging.conf (VGA, 386,
# 4 MB with EMS, Sound Blaster 2.0 with OPL2 at 220/7/1); cycles are fixed so
# runs are comparable. 12000 is the cycle count of Secret Weapons of Luftwaffe's
# reference, whose measured 68020 ratio port-plan P1.5 reuses.

[sdl]
fullscreen = false
output = surface
autolock = false

[dosbox]
machine = vgaonly
memsize = 4
captures = cap
# headless: a quit request (a signal to stop the run) must not open a native dialog
quit warning = false

[cpu]
core = normal
cputype = 386
cycles = fixed 12000

[dos]
ems = true
xms = true

[mixer]
# silent: the devices are still emulated (OPL, DSP and DMA run)
nosound = true

[sblaster]
sbtype = sb2
sbbase = 220
irq = 7
dma = 1
oplmode = opl2

[log]
logfile = dosbox-x.log
