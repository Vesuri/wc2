# DOSBox-X config for the headless original installer (tools/pc_install.sh).
# cycles=max: unpacking is CPU-bound and the installer has no timing dependence.

[sdl]
output = surface

[dosbox]
machine = svga_s3
memsize = 4
captures = cap
# headless: a quit request (a signal to stop the run) must not open a native dialog
quit warning = false

[cpu]
core = normal
cputype = 386
cycles = max

[mixer]
nosound = true
