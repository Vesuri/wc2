# DOSBox Staging config to play the original WC2 on a period machine: 386DX-33, 4 MB
# (EMS on), plain VGA, Sound Blaster 2.0 (OPL2) at 220/7/1 as the install configured.
# Runs the disposable copy made by `make prepare-reference`; ref/ is never mounted.
# Run from the repository root:
#   make reference-staging

[sdl]
fullscreen = off

[render]
aspect = auto

[dosbox]
machine = vgaonly
memsize = 4

[cpu]
# 386DX-33 ballpark from the DOSBox Staging 0.83 reference table. Adjust in game with
# Ctrl+F11 / Ctrl+F12.
core = normal
cputype = 386
cpu_cycles = 6000

[dos]
ems = true
xms = true

[mouse]
mouse_capture = onclick

[sblaster]
sbtype = sb2
sbbase = 220
irq = 7
dma = 1
oplmode = auto

[joystick]
joysticktype = auto
timed = on

[autoexec]
mount c "tmp/pc-root"
c:
cd \WING2
wc2
exit
